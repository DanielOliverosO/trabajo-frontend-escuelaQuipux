<section class="sectTabla" [formGroup]="coursesForm">
    <div class="divTitulo">
        <label class="titulo">Cursos realizados</label>
        <button (click)="addCourse()">Agregar Curso</button>
    </div>
    <table formArrayName="courses">
        <thead>
            <th>Codigo</th>
            <th>Año</th>
            <th>Grado</th>
            <th>Grupo</th>
            <th>Estado</th>
            <th>Nota promedio</th>
            <th>Acciones</th>
        </thead>
        <tbody *ngFor="let course of courses.controls; let i=index" [formGroupName]="i">
                <tr class="tr-imp">
                    <td><input class="formPart" formControlName="codigoCurso"></td>
                    <td><input class="formPart" formControlName="fecha"></td>
                    <td><input class="formPart" formControlName="grado"></td>
                    <td><input class="formPart" formControlName="grupo"></td>
                    <td>
                        <select class="formPart" formControlName="estado">
                            <option value="en curso">En curso</option>
                            <option value="aprobado">Aprobado</option>
                            <option value="reprobado">Reprobado</option>
                        </select>
                    </td>
                    <td>
                        <input class="formPart" formControlName="notaPromedio">
                    </td>
                    <td>
                        <button (click)="removeCourse(i)">Eliminar</button>
                    </td>
                </tr>
            </tbody>
    </table>
</section>
