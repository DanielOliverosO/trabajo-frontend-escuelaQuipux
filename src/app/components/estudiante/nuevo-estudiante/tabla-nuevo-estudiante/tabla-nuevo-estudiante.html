<section class="sectTabla" [formGroup]="coursesForm">
    <div class="divTitulo">
        <label class="titulo">Cursos realizados</label>
        <div style="display:flex;gap:.5rem;align-items:center;margin-left:1rem;">
            <button type="button" class="btn-blue" (click)="saveCurrentCourse()">Guardar curso</button>
        </div>
        </div>
    <table formArrayName="courses">
        
        <thead>
            <th>Codigo</th>
            <th>Año</th>
            <th>Grado</th>
            <th>Grupo</th>
            <th>Estado</th>
            <th>Nota promedio</th>
            <th>Acciones</th>
        </thead>
        <!-- Editable row (always single) -->
        <tbody *ngIf="courses.controls.length>0" [formGroupName]="0">
            <tr class="tr-imp editable-row">
                <td><input class="formPart" formControlName="codigoCurso" readonly [disabled]="true"></td>
                <td><input type="number" class="formPart" formControlName="fecha"></td>
                <td><input type="number" class="formPart" formControlName="grado"></td>
                <td><input class="formPart" formControlName="grupo"></td>
                <td>
                    <select class="formPart" formControlName="estado">
                        <option value="en curso">En curso</option>
                        <option value="aprobado">Aprobado</option>
                        <option value="reprobado">Reprobado</option>
                    </select>
                </td>
                <td>
                    <input class="formPart" formControlName="notaPromedio">
                </td>
            </tr>
        </tbody>

        <!-- Saved rows -->
        <tbody *ngFor="let saved of savedCourses; let si = index">
            <tr [ngClass]="{'tr-imp': si % 2 === 0}">
                <td>{{ saved.id?.codigoCurso || saved.codigoCurso }}</td>
                <td>{{ saved.fecha }}</td>
                <td>{{ saved.grado }}</td>
                <td>{{ saved.grupo }}</td>
                <td>{{ saved.estado }}</td>
                <td>{{ saved.notaPromedio }}</td>
            </tr>
        </tbody>
    </table>
</section>
