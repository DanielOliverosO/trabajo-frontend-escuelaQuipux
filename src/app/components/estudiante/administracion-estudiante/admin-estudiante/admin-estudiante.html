<div class="sectforms sectforms-col" [formGroup]="filterForm">
    <div class="sectformsPart sectformsPart-2col">
        <div>
            <label for="grado">Grado</label>
            <div>
                <select id="grado" class="formPart" formControlName="grado">
                    <option value="">Todos</option>
                    
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                </select>
            </div>
        </div>
        <div>
            <label for="grupo">Grupo</label>
            <div>
                <select id="grupo" class="formPart" formControlName="grupo">
                    <option value="">Todos</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>
        </div>
    </div>
    <div class="sectformsPart">
        <label for="nIdentificacion">Identificacion</label>
        <div class=" sectformsPart-Id">
            <select class="formPart" formControlName="tipoDocumento">
                <option value="">Todos</option>
                <option value="TI">TI</option>
                <option value="CC">CC</option>
                <option value="CE">CE</option>
            </select>
            <input id="nIdentificacion" class="formPart" placeholder="Número documento" type="number" formControlName="numeroDocumento">
        </div>
    </div>
    <div class="sectformsPart">
        <label for="estudiante">Estudiante</label>
        <div>
            <input id="estudiante" class="formPart" placeholder="Nombre del estudiante" formControlName="estudiante">
        </div>
    </div>
    <div class="sectformsPart sectformsPart-Buttons">
        <button type="button" (click)="onSearch()" class="btn-blue">Buscar</button>
        <button type="button" (click)="clearFilters()" class="btn-white">Limpiar filtros</button>
    </div>
</div>
